<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Top bar ─────────────────────────────────────────────── -->
  <header class="topbar">
    <span class="topbar__brand">✦ Life Dashboard</span>
    <button id="themeToggle" class="btn btn--icon" aria-label="Toggle theme">🌙</button>
  </header>

  <!-- ── Main grid ────────────────────────────────────────────── -->
  <main class="dashboard">

    <!-- 1. Greeting & Clock -->
    <section class="card card--wide" id="greetingCard">
      <div class="clock-display">
        <p id="clockTime" class="clock__time">00:00:00</p>
        <p id="clockDate" class="clock__date">Loading…</p>
      </div>
      <div class="greeting-box">
        <p id="greetingText" class="greeting__text">Hello!</p>
        <div class="greeting__name-row">
          <input
            id="nameInput"
            class="input"
            type="text"
            placeholder="Enter your name…"
            maxlength="40"
            aria-label="Your name"
          />
          <button id="nameSaveBtn" class="btn btn--primary">Save</button>
        </div>
      </div>
    </section>

    <!-- 2. Focus Timer -->
    <section class="card" id="timerCard">
      <h2 class="card__title">⏱ Focus Timer</h2>
      <p id="timerDisplay" class="timer__display">25:00</p>
      <div class="timer__controls">
        <button id="timerStart" class="btn btn--primary">Start</button>
        <button id="timerStop"  class="btn btn--secondary">Stop</button>
        <button id="timerReset" class="btn btn--ghost">Reset</button>
      </div>
    </section>

    <!-- 3. To-Do List -->
    <section class="card" id="todoCard">
      <h2 class="card__title">✅ To-Do List</h2>
      <div class="todo__input-row">
        <input
          id="todoInput"
          class="input"
          type="text"
          placeholder="Add a new task…"
          maxlength="120"
          aria-label="New task"
        />
        <button id="todoAddBtn" class="btn btn--primary">Add</button>
      </div>
      <ul id="todoList" class="todo__list" aria-label="Task list"></ul>
      <p id="todoEmpty" class="todo__empty">No tasks yet. Add one above!</p>
    </section>

    <!-- 4. Quick Links -->
    <section class="card" id="linksCard">
      <h2 class="card__title">🔗 Quick Links</h2>
      <div class="links__input-group">
        <input
          id="linkName"
          class="input"
          type="text"
          placeholder="Site name…"
          maxlength="40"
          aria-label="Site name"
        />
        <input
          id="linkUrl"
          class="input"
          type="url"
          placeholder="https://example.com"
          aria-label="Site URL"
        />
        <button id="linkAddBtn" class="btn btn--primary">Add</button>
      </div>
      <div id="linksList" class="links__list"></div>
      <p id="linksEmpty" class="links__empty">No links yet. Add one above!</p>
    </section>

  </main>

  <!-- Edit task modal -->
  <div id="editModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle" hidden>
    <div class="modal__box">
      <h3 id="editModalTitle" class="modal__title">Edit Task</h3>
      <input id="editInput" class="input" type="text" maxlength="120" aria-label="Edit task text" />
      <div class="modal__actions">
        <button id="editSaveBtn" class="btn btn--primary">Save</button>
        <button id="editCancelBtn" class="btn btn--ghost">Cancel</button>
      </div>
    </div>
  </div>
  <div id="modalOverlay" class="modal__overlay" hidden></div>

  <script src="js/script.js"></script>
</body>
</html>
